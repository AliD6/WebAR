<!DOCTYPE html>
<html>
  <head>
    <title>WebAR Location Based</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- کامپوننت look-at برای چرخش خودکار پیکان به سمت هدف -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
      /* استایل لایه نمایش فاصله روی صفحه */
      #ui-container {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: bold;
        z-index: 999;
        text-align: center;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- لایه رابط کاربری (UI) برای نمایش فاصله -->
    <div id="ui-container">
      فاصله تا هدف: <span id="distance">در حال محاسبه...</span>
    </div>

    <script>
      // اسکریپت استخراج فاصله از کتابخانه AR.js
      window.onload = () => {
        const box = document.getElementById('target-box');
        const distanceSpan = document.getElementById('distance');

        // شنونده رویداد برای آپدیت‌های موقعیت مکانی
        window.addEventListener('gps-camera-update-position', (e) => {
          // کتابخانه AR.js به صورت خودکار فاصله را محاسبه کرده و در ویژگی شیء قرار می‌دهد
          const distance = box.getAttribute('distance');
          if (distance !== null) {
            distanceSpan.innerText = Math.round(distance) + " متر";
          }
        });
      };
    </script>

    <a-scene 
      vr-mode-ui="enabled: false"
      embedded 
      arjs='sourceType: webcam; sourceWidth:1280; sourceHeight:960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;'>
      
      <!-- دوربین GPS -->
      <a-camera gps-camera rotation-reader></a-camera>

      <!-- هدف اصلی (جعبه قرمز) -->
      <a-box
        id="target-box"
        gps-entity-place="latitude: 35.6229694; longitude: 51.5003527;"
        material="color: red;"
        scale="10 10 10">
      </a-box>

      <!-- پیکان سه‌بعدی جهت‌نما -->
      <!-- این پیکان در پایین دید دوربین قرار می‌گیرد و همیشه به سمت مختصات هدف می‌چرخد -->
      <a-entity position="0 -1.5 -3">
        <a-cone
          color="yellow"
          radius-bottom="0.2"
          radius-top="0"
          height="1"
          rotation="90 0 0"
          look-at="#target-box">
        </a-cone>
      </a-entity>

    </a-scene>
  </body>
</html>
