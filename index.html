<!DOCTYPE html>
<html>
  <head>
    <title>WebAR Location Based</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      .a-canvas { width: 100% !important; height: 100% !important; }
      video {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        margin: 0 !important;
      }

      #ui-container {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: bold;
        z-index: 999;
        text-align: center;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      }
    </style>

    <script>
      window.onload = () => {
        const box = document.getElementById('target-box');
        const distanceSpan = document.getElementById('distance');

        window.addEventListener('gps-camera-update-position', (e) => {
          const distance = box.getAttribute('distance');
          if (distance !== null) {
            distanceSpan.innerText = Math.round(distance) + " متر";
          }
        });
      };

      AFRAME.registerComponent('floating-arrow', {
        tick: function () {
          const camera = document.querySelector('[gps-camera]');
          if (!camera) return;
          const cam3D = camera.object3D;
          const forward = new THREE.Vector3(0, -0.5, -3);
          forward.applyQuaternion(cam3D.quaternion);
          this.el.object3D.position.copy(cam3D.position).add(forward);
        }
      });
    </script>
  </head>
  <body>
    
    <div id="ui-container">
      فاصله تا هدف: <span id="distance">در حال جستجو...</span>
    </div>

    <a-scene 
      vr-mode-ui="enabled: false"
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-camera gps-camera rotation-reader near="0.1" far="1000"></a-camera>

      <a-entity floating-arrow look-at="#target-box">
        <a-cone
          color="yellow"
          radius-bottom="0.15"
          radius-top="0"
          height="0.6"
          rotation="90 0 0">
        </a-cone>
      </a-entity>

      <a-box
        id="target-box"
        gps-entity-place="latitude: 35.79046048522304; longitude: 50.94805422529615;"
        material="color: red; side: double; transparent: true; opacity: 0.8;"
        scale="2 2 2">
      </a-box>

    </a-scene>
  </body>
</html>
