<!DOCTYPE html>
<html>
  <head>
    <title>WebAR Location Based</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
      #ui-container {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: bold;
        z-index: 999;
        text-align: center;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      }
    </style>

    <script>
      // ۱. اسکریپت محاسبه مسافت
      window.onload = () => {
        const box = document.getElementById('target-box');
        const distanceSpan = document.getElementById('distance');

        window.addEventListener('gps-camera-update-position', (e) => {
          const distance = box.getAttribute('distance');
          if (distance !== null) {
            distanceSpan.innerText = Math.round(distance) + " متر";
          }
        });
      };

      // ۲. اسکریپت اختصاصی برای قفل کردن پیکان جلوی دوربین بدون تداخل چرخش
      AFRAME.registerComponent('floating-arrow', {
        tick: function () {
          const camera = document.querySelector('[gps-camera]');
          if (!camera) return;
          
          const cam3D = camera.object3D;
          
          // تنظیم موقعیت: 3 متر جلوتر و کمی پایین‌تر از لنز دوربین
          const forward = new THREE.Vector3(0, -0.5, -3);
          forward.applyQuaternion(cam3D.quaternion);
          
          // اعمال موقعیت به پیکان سه‌بعدی
          this.el.object3D.position.copy(cam3D.position).add(forward);
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <div id="ui-container">
      فاصله تا هدف: <span id="distance">در حال جستجو...</span>
    </div>

    <a-scene 
      vr-mode-ui="enabled: false"
      embedded 
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">
      
      <!-- دوربین -->
      <a-camera gps-camera rotation-reader near="0.1" far="1000"></a-camera>

      <!-- پیکان سه‌بعدی -->
      <!-- از تگ دوربین خارج شده و توسط اسکریپت floating-arrow جابجا می‌شود -->
      <a-entity floating-arrow look-at="#target-box">
        <a-cone
          color="yellow"
          radius-bottom="0.2"
          radius-top="0"
          height="0.8"
          rotation="-90 0 0">
        </a-cone>
      </a-entity>

      <!-- جعبه قرمز هدف -->
      <!-- با side: double اگر داخل آن بروید هم رنگ قرمز را می‌بینید -->
      <a-box
        id="target-box"
        gps-entity-place="latitude: 35.6229694; longitude: 51.5003527;"
        position="0 2 0"
        material="color: red; side: double; transparent: true; opacity: 0.7;"
        scale="4 4 4">
      </a-box>

    </a-scene>
  </body>
</html>
