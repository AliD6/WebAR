<!DOCTYPE html>
<html>
  <head>
    <title>WebAR Location Based</title>
    <!-- جلوگیری از زوم خودکار مرورگر موبایل -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- اضافه کردن کتابخانه برای چرخش پیکان به سمت هدف -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
      /* استایل پنل پایین صفحه برای نمایش مسافت */
      #ui-container {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: bold;
        z-index: 999;
        text-align: center;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- نمایش فاصله به کاربر -->
    <div id="ui-container">
      فاصله تا هدف: <span id="distance">در حال جستجوی GPS...</span>
    </div>

    <script>
      // اسکریپت محاسبه و آپدیت زنده فاصله
      window.onload = () => {
        const box = document.getElementById('target-box');
        const distanceSpan = document.getElementById('distance');

        window.addEventListener('gps-camera-update-position', (e) => {
          const distance = box.getAttribute('distance');
          if (distance !== null) {
            distanceSpan.innerText = Math.round(distance) + " متر";
          }
        });
      };
    </script>

    <!-- تنظیمات AR.js: استفاده از videoTexture برای رفع زوم بدون دستکاری ابعاد -->
    <a-scene 
      vr-mode-ui="enabled: false"
      embedded 
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">
      
      <!-- دوربین مکان‌محور -->
      <a-camera gps-camera rotation-reader>
        
        <!-- پیکان جهت‌نما (حتماً باید داخل دوربین باشد تا همراه شما حرکت کند) -->
        <!-- position باعث می‌شود پیکان کمی پایین‌تر از مرکز دید شما قرار بگیرد -->
        <a-entity position="0 -0.5 -2">
          <a-cone
            color="yellow"
            radius-bottom="0.1"
            radius-top="0"
            height="0.5"
            rotation="90 0 0"
            look-at="#target-box">
          </a-cone>
        </a-entity>

      </a-camera>

      <!-- جعبه قرمز به عنوان هدف در مختصات مکانی شما -->
      <a-box
        id="target-box"
        gps-entity-place="latitude: 35.6229694; longitude: 51.5003527;"
        material="color: red;"
        scale="5 5 5">
      </a-box>

    </a-scene>
  </body>
</html>
