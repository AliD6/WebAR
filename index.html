<!DOCTYPE html>
<html>
  <head>
    <title>WebAR Location Based</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- فایل اصلی AR.js که شامل تمام قابلیت‌های GPS است -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
      <!-- دوربین GPS -->
      <a-camera gps-camera rotation-reader></a-camera>

      <!-- قرار دادن یک مکعب سه بعدی در موقعیت GPS -->
      <!-- فراموش نکنید مختصات زیر را به مختصات دقیق خودتان تغییر دهید -->
      <a-box
        gps-entity-place="latitude: 35.6229694; longitude: 51.5003527;"
        material="color: red;"
        scale="2 2 2">
      </a-box>
    </a-scene>
  </body>
</html>
